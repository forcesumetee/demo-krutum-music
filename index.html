<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องดนตรีครูตั้ม</title>
<meta name="description" content="ต้นแบบเว็บฝึกดนตรี: เลือกเครื่องดนตรี เลือกเพลง เลือกระดับ แล้วเล่นตามคลิปพร้อม Tab คอร์ด และโน้ตที่เลื่อนตามเสียง">
<meta name="theme-color" content="#111110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2212%22 fill=%22%23f0b44c%22/%3E%3Ccircle cx=%2219%22 cy=%2230%22 r=%229%22 fill=%22%23241703%22/%3E%3Cpath d=%22M22 27L36 10%22 stroke=%22%23241703%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111110; --card:#1b1a18; --card-2:#24221f; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --text:#f4f1ea; --muted:#a8a398; --faint:#6f6b63;
  --accent:#f0b44c; --accent-2:#ff8a5c; --accent-ink:#241703; --accent-soft:rgba(240,180,76,.14);
  --teal:#5cc8b0; --danger:#ef6f5e;
  --paper:#fffdf8; --radius:16px; --gut:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f2ea; --card:#ffffff; --card-2:#efebe1; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.16);
    --text:#1d1b17; --muted:#6a655b; --faint:#9a9488;
    --accent:#c4831a; --accent-2:#e2683a; --accent-ink:#fffaf0; --accent-soft:rgba(196,131,26,.13);
    --teal:#13866d; --paper:#ffffff; color-scheme: light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--gut) 56px}

/* ---------- การเคลื่อนไหวพื้นฐาน ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.45)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
@keyframes chordIn{from{opacity:0;transform:translateY(40%) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:.55}100%{transform:translate(var(--dx),-180px) rotate(var(--rot));opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,180,76,.55)}100%{box-shadow:0 0 0 18px rgba(240,180,76,0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.04)}}
@keyframes vib{0%,100%{transform:translateY(0)}25%{transform:translateY(-1.4px)}75%{transform:translateY(1.4px)}}
@keyframes fadeSwap{0%{opacity:1}40%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.reveal{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
::view-transition-old(root){animation:.18s ease both fadeOut}
::view-transition-new(root){animation:.32s var(--ease) both rise}
@keyframes fadeOut{to{opacity:0}}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:560px;margin:0 auto;padding:10px var(--gut);display:flex;align-items:center;gap:10px;min-height:58px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring),border-color .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px}
.tb-title{min-width:0;flex:1}
.tb-title b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- หน้าแรก ---------- */
.hero{position:relative;padding:30px 0 18px}
.notesfx{position:absolute;inset:-10px -16px 0;pointer-events:none;overflow:hidden;z-index:0}
.notesfx span{position:absolute;bottom:0;color:var(--accent);filter:opacity(.6);font-size:var(--fs);animation:floatUp var(--dur) linear infinite;animation-delay:var(--delay);opacity:0}
.hero > *:not(.notesfx){position:relative;z-index:1}
.brandmark{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.02em}
.brandmark svg{width:24px;height:24px;animation:wiggle 2.4s var(--ease) 1s both}
.hero h1{font-size:30px;line-height:1.22;margin:10px 0 6px;font-weight:600}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted)}
.stats{display:flex;gap:26px;margin-top:14px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.search{margin:18px 0 6px;position:relative}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 14px 0 46px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--faint)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;gap:12px}
.sec-h h2{font-size:17px;margin:0;font-weight:600}
.sec-h span{font-size:13px;color:var(--muted);text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{position:relative;display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;min-height:150px;overflow:hidden;transition:transform .25s var(--spring),border-color .2s}
.cat::after{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);transition:transform .5s var(--ease)}
.cat:hover::after{transform:scale(1.4)}
.cat:active{transform:scale(.96)}
.cat:hover{border-color:var(--line-2)}
.cat:hover .ic svg,.cat:focus-visible .ic svg{animation:wiggle .6s var(--ease)}
.cat .ic{width:54px;height:54px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cat .ic svg{width:36px;height:36px}
.cat b{font-weight:600;font-size:17px;display:block}
.cat small{color:var(--muted);font-size:13px}
.cat .count{position:absolute;top:14px;right:14px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.cat.soon{opacity:.5;pointer-events:none}
.cat.soon .ic{background:var(--card-2);color:var(--muted)}
.rail-x{display:flex;gap:12px;overflow-x:auto;padding:2px var(--gut) 8px;margin:0 calc(-1 * var(--gut));scroll-snap-type:x mandatory;scrollbar-width:none}
.rail-x::-webkit-scrollbar{display:none}
.tunecard{flex:none;width:220px;scroll-snap-align:start;border-radius:var(--radius);padding:16px;background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .25s var(--spring)}
.tunecard:active{transform:scale(.97)}
.tunecard b{font-weight:600;line-height:1.3}
.tunecard small{color:var(--muted);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-ic{display:flex;gap:6px;margin-top:auto}
.mini-ic span{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mini-ic svg{width:20px;height:20px}
.footer-link{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding:14px 16px;border-radius:var(--radius);border:1px dashed var(--line-2);color:var(--muted);text-decoration:none;font-size:14px}
.footer-link b{color:var(--text);font-weight:500}

/* ---------- รายการเพลง ---------- */
.cat-head{display:flex;gap:14px;align-items:center;padding:22px 0 8px}
.cat-head .ic{width:62px;height:62px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.cat-head .ic svg{width:40px;height:40px;animation:wiggle .9s var(--ease) .2s both}
.cat-head h1{margin:0;font-size:24px;font-weight:600;line-height:1.25}
.cat-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.songs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.song{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;transition:transform .25s var(--spring),border-color .2s}
.song:active{transform:scale(.98)}
.song:hover{border-color:var(--line-2)}
.song .thumb{width:54px;height:54px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none;transition:transform .3s var(--spring)}
.song:hover .thumb{transform:rotate(-6deg) scale(1.06)}
.song .thumb svg{width:20px;height:20px;margin-left:2px}
.song .meta{min-width:0;flex:1}
.song b{display:block;font-weight:600;line-height:1.35}
.song small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song > svg{flex:none;color:var(--faint);transition:transform .25s var(--ease)}
.song:hover > svg{transform:translateX(3px)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--card-2);color:var(--muted)}
.tag.ac{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}

/* ---------- เวที (คลิปจำลอง) ---------- */
.stage{position:relative;margin-top:14px;aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,#2b2419 0%,#121110 55%,#0b0b0a 100%);border:1px solid var(--line);color:#f4f1ea;user-select:none;isolation:isolate}
.stage .chip{position:absolute;top:12px;left:12px;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d8d3c8;z-index:3;display:flex;align-items:center;gap:6px}
.stage .chip i{width:7px;height:7px;border-radius:50%;background:#7d776c}
.stage.playing .chip i{background:#ef6f5e;animation:pulse 1.4s infinite}
.stage .label{position:absolute;left:14px;top:42px;right:90px;font-size:13px;color:#bdb7ab;line-height:1.35;z-index:3}
.stage .label b{display:block;color:#fff;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .nowchord{position:absolute;top:10px;right:10px;min-width:52px;text-align:center;font-weight:600;font-size:20px;padding:6px 12px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#241703;z-index:3;box-shadow:0 6px 20px rgba(240,140,60,.3)}
.stage .nowchord:empty{display:none}
.stage .nowchord.flip{animation:chordIn .35s var(--ease)}
.stage .viz{position:absolute;left:0;right:0;bottom:30px;z-index:1}
.stage .viz svg{display:block;width:100%;height:auto}
.stage .bigplay{position:absolute;left:50%;top:44%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:0;background:rgba(20,18,15,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;z-index:4;transition:opacity .3s,transform .3s var(--spring);box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.stage .bigplay svg{width:28px;height:28px;margin-left:3px}
.stage.playing .bigplay{opacity:0;transform:scale(.6);pointer-events:none}
.stage .bot{position:absolute;left:12px;right:12px;bottom:8px;display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:12.5px;color:#cfc9bd;font-variant-numeric:tabular-nums}
.stage .eq{display:flex;align-items:flex-end;gap:3px;height:16px}
.stage .eq i{display:block;width:3px;height:4px;border-radius:2px;background:var(--accent)}
.stage.playing .eq i{animation:eqb .9s ease-in-out infinite}
.stage .eq i:nth-child(2){animation-delay:-.3s}.stage .eq i:nth-child(3){animation-delay:-.6s}.stage .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eqb{0%,100%{height:4px}50%{height:16px}}
/* คอกีตาร์ */
.fb-wood{fill:#2a1d14}
.fb-fret{stroke:#bba98c;stroke-width:2}
.fb-nut{fill:#e9e0cd}
.fb-inlay{fill:#e9e0cd;opacity:.35}
.fb-str{stroke:#d9cfbd;stroke-linecap:round}
.fb-str.vib{animation:vib .09s linear 4}
.fb-lab{fill:#9b9385;font-size:13px;font-family:inherit}
.ghost{fill:#f0b44c;opacity:.22;transition:opacity .3s}
.hit{transform-box:fill-box;transform-origin:center;animation:pop .32s var(--spring) both}
.hit-dot{fill:url(#hitgrad);stroke:#fff3d6;stroke-width:1.5}
.hit-ring{fill:none;stroke:#ffcf7a;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple .6s var(--ease) forwards}
.hit-txt{fill:#241703;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* คีย์บอร์ด */
.k-w{fill:#f6f1e6;stroke:#6f6758;stroke-width:1;transition:fill .12s}
.k-b{fill:#1d1a16;transition:fill .12s}
.k-w.down{fill:#f0b44c}
.k-b.down{fill:#ff8a5c}
.k-glow{fill:#ffcf7a;opacity:0}
.k-glow.on{animation:keyglow .5s var(--ease)}
@keyframes keyglow{0%{opacity:.75}100%{opacity:0}}

/* ---------- ตัวควบคุม ---------- */
.vers{margin-top:14px}
.vers .lab{font-size:13px;color:var(--muted);margin:0 2px 6px;display:flex;justify-content:space-between}
.chips{position:relative;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:transform .45s var(--spring),width .45s var(--spring);z-index:0;box-shadow:0 4px 14px rgba(240,140,60,.25)}
.chips button{position:relative;z-index:1;flex:1 0 auto;min-width:88px;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:color .3s}
.chips button b{font-weight:600;font-size:15px}
.chips button small{font-size:11.5px;opacity:.85}
.chips button.on{color:var(--accent-ink)}
.vnote{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:20px}
.vnote.swap{animation:fadeSwap .4s var(--ease)}

.transport{margin-top:14px;display:flex;align-items:center;gap:12px}
.playbtn{position:relative;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring);box-shadow:0 8px 22px rgba(240,140,60,.28)}
.playbtn:active{transform:scale(.9)}
.playbtn.playing{animation:pulse 1.6s infinite}
.playbtn svg{width:24px;height:24px}
.playbtn[disabled]{opacity:.45;box-shadow:none}
.playbtn .spin{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.playbtn:not([disabled]) .spin{display:none}
.seekwrap{flex:1;min-width:0}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--card-2) var(--p))}
.seek::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--card-2) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .2s var(--spring)}
.seek:active::-webkit-slider-thumb{transform:scale(1.3)}
.seek::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.status{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);transition:background .25s,color .25s,transform .2s var(--spring)}
.pill:active{transform:scale(.93)}
.pill svg{width:16px;height:16px}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.on svg{animation:wiggle .5s var(--ease)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.speed button{height:34px;padding:0 11px;border:0;background:transparent;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.speed button.on{background:var(--accent-soft);color:var(--accent)}

.seg{position:relative;margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s}
.seg button svg{width:18px;height:18px;transition:transform .35s var(--spring)}
.seg button.on{color:var(--text)}
.seg button.on svg{transform:scale(1.15);color:var(--accent)}
.seg button[disabled]{opacity:.3;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--faint);margin:8px 2px 0}

.paper{position:relative;margin-top:12px;border-radius:var(--radius);background:var(--paper);overflow:hidden;border:1px solid var(--line);transition:opacity .25s}
.paper.swap{animation:fadeSwap .5s var(--ease)}
.paper .scroll{overflow:auto;max-height:64vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.paper.tabmode .scroll{max-height:none;overflow-y:hidden}
.paper.offstage{position:absolute;left:-10000px;top:0;width:calc(min(560px,100vw) - 2*var(--gut));visibility:hidden}
.paper .loading{position:absolute;inset:0;background:var(--paper);z-index:3;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.paper .loading[hidden]{display:none}
.paper .loading i{display:block;height:46px;border-radius:8px;background:linear-gradient(90deg,#f1ece2 25%,#faf7f0 50%,#f1ece2 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.paper .loading i:nth-child(2){width:86%}.paper .loading i:nth-child(3){width:94%}
.paper .at-cursor-bar{background:rgba(240,180,76,.22)!important;transition:all .12s linear}
.paper .at-cursor-beat{background:#e2553f!important;width:3px!important;border-radius:2px;box-shadow:0 0 8px rgba(226,85,63,.6)}
.paper .at-selection div{background:rgba(92,200,176,.22)!important}
.paper .at-highlight *{fill:#d9480f;stroke:#d9480f}

.cv{margin-top:12px}
.strip{position:relative;overflow-x:auto;overflow-y:hidden;border-radius:14px;border:1px solid var(--line);background:var(--card);scrollbar-width:none;-webkit-overflow-scrolling:touch}

.strip .rail{position:relative;display:flex;height:58px}
.strip .s{flex:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;transition:background .3s,color .3s}
.strip .s.on{background:var(--accent-soft);color:var(--accent)}
.strip .ph{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--danger);left:0;pointer-events:none;will-change:transform;box-shadow:0 0 10px rgba(239,111,94,.7)}
.now{margin-top:12px;display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);overflow:hidden}
.now .l{flex:1;min-width:0}
.now small{color:var(--muted);font-size:13px}
.now .name{font-size:54px;line-height:1.05;font-weight:600;letter-spacing:-.01em}
.now .name.flip{animation:chordIn .4s var(--ease)}
.now .next{color:var(--muted);font-size:15px;margin-top:4px}
.now .next b{color:var(--text);font-weight:600}
.now .d{flex:none;width:150px}
.now .d svg{width:100%;height:auto;display:block}
.now .d .dot{transform-box:fill-box;transform-origin:center;animation:pop .4s var(--spring) both}
.allch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.allch button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px 6px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .3s,background .3s,transform .25s var(--spring)}
.allch button:active{transform:scale(.95)}
.allch button.on{border-color:var(--accent);background:var(--accent-soft)}
.allch b{font-weight:600}
.allch svg{width:100%;max-width:96px;height:auto}
.allch .dot{animation:none}

.card p{margin:0;color:var(--muted);font-size:14.5px}

.fact small{display:block;font-size:12px;color:var(--muted)}

/* ---------- หน้าครู ---------- */

.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}

.vlist label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--text)}

.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:26px;height:26px;color:var(--accent)}
.drop b{color:var(--text);font-weight:500}

.wave svg{position:absolute;inset:0;width:100%;height:100%}

const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NAMES_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const KEY_PC = { C: [0, 2, 4, 5, 7, 9, 11], G: [7, 9, 11, 0, 2, 4, 6], D: [2, 4, 6, 7, 9, 11, 1] };

  const m = /^([A-G])(#|b)?(.*)$/.exec(name);

  return { root, iv: CH_Q[m[3]] || CH_Q[''] };

  const pcs = KEY_PC[key] || KEY_PC.C;

/* ---------- แปลงทำนอง ---------- */
function parseMelody(src) {
  return src.split('|').map(bar => bar.trim().split(/\s+/).filter(Boolean).map(tok => {
    const [p, d] = tok.split('/');
    const dotted = d.endsWith('.');

/* ---------- ทำนอง (ใช้ได้ทุกเครื่องที่มีเสียงสูงต่ำ) ---------- */
function melodyBars(tune, { shift = 0, tuning = null, variation = null } = {}) {
  const bars = parseMelody(tune.melody); const segs = chordSegments(tune);
  return bars.map((bar, bi) => {

      const pieces = (!n.rest && variation && !last) ? variation(n.midi + shift, n.len, tune.key) : [{ midi: n.rest ? null : n.midi + shift, len: n.len }];
      for (const p of pieces) {

        else content = midiName(p.midi);

// แปรทำนองแบบโมซาร์ท: โน้ตยาวแตกเป็นเขบ็ต 2 ชั้น (โน้ต-บน-โน้ต-ล่าง)

  const up = scaleNeighbor(m, key, 1), dn = scaleNeighbor(m, key, -1);
  const out = []; for (let i = 0; i < len / 4; i++) out.push({ midi: m, len: 1 }, { midi: up, len: 1 }, { midi: m, len: 1 }, { midi: dn, len: 1 });

  let s = 0; while (Math.min(...ps) + s < lo) s += 12; while (Math.max(...ps) + s > hi && Math.min(...ps) + s - 12 >= lo) s -= 12;

function shapeNotes(shape) { return shape.map((f, i) => f < 0 ? null : `${f}.${i + 1}`).filter(Boolean); }

  const lib = SHAPES[kind];

    const beats = [];
    for (const seg of segs) {
      const tuple = `(${shapeNotes(lib[seg.name]).join(' ')})`;
      const q = seg.len / 4; // จำนวนจังหวะตัวดำ
      const pat = [];
      for (let i = 0; i < q; i++) {
        if (q === 1) pat.push([4, 'bd']);
        else if (i % 2 === 0) pat.push([4, 'bd']);
        else pat.push([2, 'bd'], [2, 'bu']);
      }
      pat.forEach(([len, fx], i) => beats.push({ len, content: tuple, fx: i === 0 ? [`ch "${seg.name}"`, fx] : [fx] }));

      const seq = [bass, n(3), n(2), n(1), n(2), n(3), n(2), n(1)].slice(0, seg.len / 2);
      seq.forEach((c, i) => beats.push({ len: 2, content: c, fx: i === 0 ? [`ch "${seg.name}"`] : [] }));

      const { root } = chordInfo(seg.name);
      const fe = (root - 4 + 12) % 12, fa = (root - 9 + 12) % 12;
      const [s, f] = fe <= fa ? [6, fe] : [5, fa];
      const nm = NAMES_SHARP[root] + '5';
      const tuple = `(${f}.${s} ${f + 2}.${s - 1} ${f + 2}.${s - 2})`;
      const cnt = seg.len / 2;
      for (let i = 0; i < cnt; i++) beats.push({ len: 2, content: tuple, fx: i === 0 ? [`ch "${nm}"`] : [] });
    }
    return emitBeats(beats);
  }).join(' |\n');
}
function powerDefs(tune) {

    const { root } = chordInfo(n);
    const fe = (root - 4 + 12) % 12, fa = (root - 9 + 12) % 12;
    const nm = NAMES_SHARP[root] + '5'; if (out.has(nm)) return ''; out.add(nm);
    const arr = fe <= fa ? ['x', 'x', 'x', fe + 2, fe + 2, fe] : ['x', 'x', fa + 2, fa + 2, fa, 'x'];
    return `\\chord ("${nm}" ${arr.join(' ')})`;

/* ---------- เบส ---------- */
function bassBars(tune, walk) {
  const tun = TUNING.bass;
  return chordSegments(tune).map(segs => {
    const beats = [];
    for (const seg of segs) {
      const { root } = chordInfo(seg.name);
      const r = 28 + ((root - 4 + 12) % 12);
      const q = seg.len / 4;
      const seq = walk ? [r, r + 7, r + 12, r + 7].slice(0, q) : Array(q).fill(r);
      seq.forEach((m, i) => { const p = fretPos(m, tun); beats.push({ len: 4, content: `${p.f}.${p.s}`, fx: i === 0 ? [`ch "${seg.name}"`] : [] }); });
    }
    return emitBeats(beats);
  }).join(' |\n');
}

/* ---------- เปียโนมือซ้าย ---------- */
function lhBars(tune, style) {
  return chordSegments(tune).map(segs => {
    const beats = [];
    for (const seg of segs) {
      const { root, iv } = chordInfo(seg.name);
      const r = 48 + root - (root > 7 ? 12 : 0); // รากราว C3
      const tri = iv.slice(0, 3).map(i => r + i);
      if (style === 'block') {
        splitLen(seg.len).forEach(l => beats.push({ len: l, content: `(${tri.map(midiName).join(' ')})` }));
      } else { // alberti: ราก-5-3-5
        const pat = [tri[0], tri[2], tri[1], tri[2]];
        for (let i = 0; i < seg.len / 2; i++) beats.push({ len: 2, content: midiName(pat[i % 4]) });

  }).join(' |\n');
}

    const y = y0 + r * gap;
    s += `<text class="fb-lab" x="${x0 - 44}" y="${y + 4.5}" text-anchor="middle">${l}</text>`;
    s += `<line class="fb-str" data-r="${r}" x1="${x0 - 2}" x2="${x1}" y1="${y}" y2="${y}" stroke-width="${1 + r * (2 / n)}"/>`;
  });
  s += `<g id="ghost"></g><g id="hits"></g></svg>`;
  host.innerHTML = s;
  Object.assign(VIZ, { kind: 'board', n, x0, fw, y0, gap, fretless });
}
function vizGhost(chord) {
  const g = $('#ghost'); if (!g || VIZ.kind !== 'board') return;
  if (!chord || !chord.strings || chord.strings.length !== VIZ.n) { g.innerHTML = ''; return; }
  g.innerHTML = chord.strings.map((f, r) => f > 0 ? `<circle class="ghost" cx="${VIZ.x0 + (f - .5) * VIZ.fw}" cy="${VIZ.y0 + r * VIZ.gap}" r="9"/>` : '').join('');
}
function vizHit(beats) {
  if (!VIZ.kind) return;
  if (VIZ.kind === 'keys') {
    $$('#viz .down').forEach(e => e.classList.remove('down'));
    for (const b of beats) for (const nt of b.notes) {
      const m = nt.realValue; const k = $(`#viz [data-k="${m}"]`); if (k) k.classList.add('down');
      const g = $(`#viz [data-g="${m}"]`); replay(g, 'on');
    }
    return;
  }
  const hits = $('#hits'); if (!hits) return;
  let s = '';
  for (const b of beats) for (const nt of b.notes) {
    let row, f;
    if (VIZ.fretless) { // ไวโอลิน: หาสายจากระดับเสียง
      const m = nt.realValue; row = VIOLIN_OPEN.findIndex(o => m - o >= 0 && m - o <= 7); if (row < 0) row = m < 55 ? 3 : 0;
      f = m - VIOLIN_OPEN[row];
    } else { row = VIZ.n - nt.string; f = nt.fret; }
    if (row < 0 || row >= VIZ.n) continue;
    const y = VIZ.y0 + row * VIZ.gap;
    const x = f === 0 ? VIZ.x0 - 22 : VIZ.x0 + (f - .5) * VIZ.fw;
    s += `<g class="hit"><circle class="hit-ring" cx="${x}" cy="${y}" r="10"/><circle class="hit-dot" cx="${x}" cy="${y}" r="${f === 0 ? 9 : 11}"/>${f > 0 ? `<text class="hit-txt" x="${x}" y="${y}">${f}</text>` : ''}</g>`;
    replay($(`#viz .fb-str[data-r="${row}"]`), 'vib');
  }
  hits.innerHTML = s;
}

let atPromise = null;
function ensureAlphaTab() {
  if (window.alphaTab) return Promise.resolve();
  if (atPromise) return atPromise;
  atPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = AT_BASE + 'alphaTab.min.js';
    s.onload = () => res(); s.onerror = () => { atPromise = null; rej(new Error('alphaTab load failed')); };
    document.head.appendChild(s);
  });
  return atPromise;
}

function moveIndicator(container, ind, btn) {
  if (!container || !ind || !btn) return;
  ind.style.width = btn.offsetWidth + 'px';
  ind.style.transform = `translateX(${btn.offsetLeft}px)`;
}

function setupPlayer(song, ver) {
  const at = window.alphaTab;
  const el = $('#at'), scrollEl = $('#scroll');
  const api = new at.AlphaTabApi(el, {
    core: { fontDirectory: AT_BASE + 'font/', enableLazyLoading: false, useWorkers: false, logLevel: 'warning' },
    display: { scale: 0.82, staveProfile: at.StaveProfile.Tab, layoutMode: at.LayoutMode.Horizontal },
    player: {
      playerMode: at.PlayerMode.EnabledSynthesizer, soundFont: AT_BASE + 'soundfont/sonivox.sf3',
      scrollElement: scrollEl, scrollMode: at.ScrollMode.Continuous,
      enableCursor: true, enableAnimatedBeatCursor: true, enableUserInteraction: true, scrollOffsetX: -24, scrollOffsetY: -40
    }
  });
  const st = player = { song, ver, api, view: null, segs: [], endTick: 0, segIdx: -1, playing: false, seeking: false, pxPerTick: 34 / 960 };

  api.soundFontLoad.on(e => { if (e.total) $('#status').textContent = `กำลังโหลดเสียง ${Math.round(e.loaded / e.total * 100)}%`; });
  api.playerReady.on(() => { $('#play').disabled = false; $('#status').textContent = 'พร้อมเล่น · แตะโน้ตเพื่อข้ามไปตรงนั้น'; });
  api.renderStarted.on(() => { $('#loading').hidden = false; });
  api.renderFinished.on(() => { $('#loading').hidden = true; });

  api.scoreLoaded.on(score => {
    const staff = score.tracks[0].staves[0];
    const segs = []; let last = 0; let lo = 127, hi = 0;
    score.tracks[0].staves.forEach(sf => sf.bars.forEach(bar => bar.voices[0].beats.forEach(beat => beat.notes.forEach(n => { lo = Math.min(lo, n.realValue); hi = Math.max(hi, n.realValue); }))));
    for (const bar of staff.bars) for (const beat of bar.voices[0].beats) {
      const end = beat.absolutePlaybackStart + beat.playbackDuration; if (end > last) last = end;
      if (beat.chord && beat.chord.name) {
        const prev = segs[segs.length - 1];
        if (prev && prev.name === beat.chord.name) continue;
        segs.push({ name: beat.chord.name, chord: beat.chord, start: beat.absolutePlaybackStart });
      }
    }
    segs.forEach((s, i) => s.end = i < segs.length - 1 ? segs[i + 1].start : last);
    st.segs = segs; st.endTick = last;
    buildViz(song.cat, [lo, hi]);
    buildChordView();
  });

  api.playerStateChanged.on(e => {
    st.playing = e.state === 1;
    $('#stage').classList.toggle('playing', st.playing);
    const b = $('#play'); b.classList.toggle('playing', st.playing && !REDUCED);
    b.innerHTML = `<span class="spin"></span>${st.playing ? UI.pause : UI.play}`; b.setAttribute('aria-label', st.playing ? 'หยุดชั่วคราว' : 'เล่น');
    if (!st.playing) { const h = $('#hits'); if (h) h.innerHTML = ''; $$('#viz .down').forEach(k => k.classList.remove('down')); }
  });
  api.playerPositionChanged.on(e => {
    $('#tend').textContent = fmt(e.endTime); $('#tcur').textContent = fmt(e.currentTime);
    $('#vtc').textContent = `${fmt(e.currentTime)} / ${fmt(e.endTime)}`;
    if (!st.seeking) { const sk = $('#seek'); sk.max = Math.max(1, Math.round(e.endTime)); sk.value = Math.round(e.currentTime); sk.style.setProperty('--p', (e.currentTime / Math.max(1, e.endTime) * 100) + '%'); }
    updateChord(e.currentTick);
  });
  api.activeBeatsChanged.on(e => { if (st.playing) vizHit(e.activeBeats); });

  const toggle = () => { if ($('#play').disabled) { toast('กำลังโหลดเสียง รอสักครู่'); return; } api.playPause(); };
  $('#play').onclick = toggle; $('#bigplay').onclick = toggle;
  $('#restart').onclick = () => { api.stop(); updateChord(0); };
  const seek = $('#seek');
  seek.addEventListener('input', () => { st.seeking = true; $('#tcur').textContent = fmt(+seek.value); seek.style.setProperty('--p', (+seek.value / +seek.max * 100) + '%'); });
  seek.addEventListener('change', () => { api.timePosition = +seek.value; st.seeking = false; });
  $$('.speed button').forEach(b => b.onclick = () => { api.playbackSpeed = +b.dataset.sp; $$('.speed button').forEach(x => x.classList.toggle('on', x === b)); toast(`ความเร็ว ${b.dataset.sp}×`); });
  $('#loop').onclick = (e) => { api.isLooping = !api.isLooping; e.currentTarget.classList.toggle('on', api.isLooping); e.currentTarget.setAttribute('aria-pressed', api.isLooping); toast(api.isLooping ? 'เปิดวนซ้ำ · ลากคลุมโน้ตเพื่อวนเฉพาะท่อน' : 'ปิดวนซ้ำ'); };
  $('#metro').onclick = (e) => { const on = api.metronomeVolume > 0; api.metronomeVolume = on ? 0 : 1; e.currentTarget.classList.toggle('on', !on); e.currentTarget.setAttribute('aria-pressed', !on); };
  $$('.seg button[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
  $$('#chips button').forEach(b => b.onclick = () => setVersion(b.dataset.ver));
  window.addEventListener('resize', syncIndicators);

  applyVersion(ver, true);
  api.tex(ver.tex);
}
function syncIndicators() {
  const st = player; if (!st) return;
  moveIndicator($('#chips'), $('#vind'), $(`#chips button[data-ver="${st.ver.id}"]`));
  const i = ['tab', 'chord', 'score'].indexOf(st.view); const ind = $('#sind'); if (ind) ind.style.transform = `translateX(${i * 100}%)`;
}
function applyVersion(ver, initial) {
  const st = player; st.ver = ver;
  $$('#chips button').forEach(b => { const on = b.dataset.ver === ver.id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  const note = $('#vnote'); if (note) { note.textContent = `${ver.note} · ระดับ${ver.level}`; replay(note, 'swap'); }
  $('#vlabel').textContent = `${ver.label} · คลิปครูจะแสดงตรงนี้`;
  $('#flevel').textContent = ver.level; $('#ftempo').textContent = `${ver.tempo} BPM`; $('#ftip').textContent = ver.tip;
  $$('.seg button[data-view]').forEach(b => { const ok = ver.views.includes(b.dataset.view); b.disabled = !ok; b.title = ok ? '' : 'ไม่มีสำหรับเครื่องนี้'; });
  const want = st.view && ver.views.includes(st.view) ? st.view : (ver.views.includes('tab') ? 'tab' : 'score');
  setView(want, initial);
  requestAnimationFrame(syncIndicators);
}
function setVersion(id) {
  const st = player; if (!st || st.ver.id === id) return;
  const ver = st.song.versions.find(v => v.id === id); if (!ver) return;
  st.api.stop();
  applyVersion(ver);
  replay($('#paper'), 'swap');
  st.api.tex(ver.tex);
  history.replaceState(null, '', `#/song/${st.song.id}/${id}`);
}

const VIEW_HINT = {
  tab: 'Tab เลื่อนตามเสียง · ตัวเลขคือเฟรตที่ต้องกด · แตะโน้ตเพื่อข้าม ลากคลุมเพื่อเลือกท่อนวน',
  score: 'โน้ตสากลพร้อมชื่อคอร์ด · แถบเหลืองคือห้องที่กำลังเล่น',
  chord: 'แถบสีคือคอร์ดตามเวลา เส้นแดงคือตำแหน่งปัจจุบัน · แตะคอร์ดเพื่อข้ามไป'
};
function setView(v, initial) {
  const st = player; if (!st) return;
  const at = window.alphaTab, api = st.api;
  if (!st.ver.views.includes(v)) return;
  const prev = st.view; st.view = v;
  $$('.seg button[data-view]').forEach(b => { const on = b.dataset.view === v; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  syncIndicators();
  $('#viewhint').textContent = VIEW_HINT[v];
  const paper = $('#paper');
  $('#cv').hidden = v !== 'chord';
  paper.classList.toggle('offstage', v === 'chord');
  paper.classList.toggle('tabmode', v === 'tab');
  if (v === 'chord') { if (!initial) replay($('#cv'), 'reveal'); centerPlayhead(); return; }
  const want = v === 'tab' ? { p: at.StaveProfile.Tab, l: at.LayoutMode.Horizontal } : { p: at.StaveProfile.Score, l: at.LayoutMode.Page };
  const s = api.settings, els = s.notation.elements, showHead = v === 'score';
  [at.NotationElement.ScoreTitle, at.NotationElement.ScoreSubTitle, at.NotationElement.ScoreWordsAndMusic].forEach(k => els.set(k, showHead));
  [at.NotationElement.GuitarTuning, at.NotationElement.TrackNames, at.NotationElement.ChordDiagrams, at.NotationElement.EffectDynamics].forEach(k => els.set(k, false));
  const narrow = window.innerWidth < 480;
  const same = s.display.staveProfile === want.p && s.display.layoutMode === want.l;
  s.display.staveProfile = want.p; s.display.layoutMode = want.l;
  s.display.barsPerRow = (v === 'score' && narrow) ? 2 : -1;
  s.display.scale = v === 'score' ? (narrow ? 0.72 : 0.9) : (narrow ? 0.82 : 0.95);
  if (initial || (same && prev !== 'chord')) return;
  replay(paper, 'swap');
  api.updateSettings();
  if (api.score) api.render();
}

function buildChordView() {
  const st = player, cat = st.song.cat; const rail = $('#rail');
  if (!st.segs.length) { rail.innerHTML = ''; $('#cname').textContent = '–'; return; }
  rail.style.width = Math.max(st.endTick * st.pxPerTick, $('#strip').clientWidth || 300) + 'px';
  rail.innerHTML = st.segs.map((s, i) => `<button class="s" data-i="${i}" style="width:${(s.end - s.start) * st.pxPerTick}px" aria-label="ข้ามไปคอร์ด ${esc(s.name)}">${esc(s.name)}</button>`).join('') + '<div class="ph" id="ph"></div>';
  $$('#rail .s').forEach(b => b.onclick = () => { const s = st.segs[+b.dataset.i]; st.api.tickPosition = s.start; updateChord(s.start); });
  const uniq = []; const seen = new Set();
  st.segs.forEach(s => { if (!seen.has(s.name)) { seen.add(s.name); uniq.push(s); } });
  $('#allch').innerHTML = uniq.map(s => `<button data-n="${esc(s.name)}"><b>${esc(s.name)}</b>${diagramFor(cat, s.chord, FRETTED.includes(cat) ? { color: 'var(--text)' } : undefined)}</button>`).join('');
  $$('#allch button').forEach(b => b.onclick = () => { const s = st.segs.find(x => x.name === b.dataset.n); st.api.tickPosition = s.start; updateChord(s.start); });
  st.segIdx = -1; updateChord(0);
}
function updateChord(tick) {
  const st = player; if (!st || !st.segs.length) return;
  let i = st.segs.findIndex(s => tick >= s.start && tick < s.end);
  if (i < 0) i = tick >= st.endTick ? st.segs.length - 1 : 0;
  const ph = $('#ph'); if (ph) ph.style.transform = `translateX(${tick * st.pxPerTick}px)`;
  if (st.view === 'chord') centerPlayhead();
  if (i === st.segIdx) return;
  st.segIdx = i;
  const s = st.segs[i], n = st.segs[i + 1];
  const v = $('#vchord'); v.textContent = s.name; replay(v, 'flip');
  const nm = $('#cname'); nm.textContent = s.name; replay(nm, 'flip');
  $('#cnext').innerHTML = n ? `ถัดไป: <b>${esc(n.name)}</b>` : 'คอร์ดสุดท้าย';
  $('#cdiag').innerHTML = diagramFor(st.song.cat, s.chord);
  $('#ctones').innerHTML = FRETTED.includes(st.song.cat) ? '' : tonesFor(s.name).map((t, k) => `<span style="animation-delay:${k * 60}ms">${t}</span>`).join('');
  $$('#rail .s').forEach((b, k) => b.classList.toggle('on', k === i));
  $$('#allch button').forEach(b => b.classList.toggle('on', b.dataset.n === s.name));
  vizGhost(s.chord);
}
function centerPlayhead() {
  const strip = $('#strip'), ph = $('#ph'), st = player; if (!strip || !ph || !st) return;
  const x = (st.api.tickPosition || 0) * st.pxPerTick;
  const target = x - strip.clientWidth * 0.35;
  if (Math.abs(strip.scrollLeft - target) > 4) strip.scrollLeft = target;
}

/* ---------- หน้าครู (ตัวอย่าง) ---------- */
function renderTeacher() {
  document.title = `สำหรับครู · ${BRAND.name}`;
  let bars = ''; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 120; i++) { const h = 8 + rnd() * 60 * (0.55 + 0.45 * Math.sin(i / 7) ** 2); bars += `<rect x="${i * 5 + 1}" y="${48 - h / 2}" width="3" height="${h}" rx="1.5" fill="var(--faint)"/>`; }
  let marks = '';
  for (let b = 0; b < 8; b++) { const x = 12 + b * 74, pin = b === 0 || b === 4; marks += `<line x1="${x}" x2="${x}" y1="0" y2="96" stroke="${pin ? 'var(--accent)' : 'var(--line-2)'}" stroke-width="${pin ? 2 : 1}"/><rect x="${x - 9}" y="2" width="18" height="16" rx="4" fill="${pin ? 'var(--accent)' : 'var(--card-2)'}"/><text x="${x}" y="14" font-size="10" text-anchor="middle" fill="${pin ? 'var(--accent-ink)' : 'var(--muted)'}">${b + 1}</text>`; }
  app.innerHTML = topbar('เพิ่มเพลงใหม่', 'สำหรับครู', '#/') + `
  <div class="wrap">
    <div class="banner reveal">หน้านี้เป็นตัวอย่างหน้าจอสำหรับครู ยังบันทึกจริงไม่ได้</div>
    <section class="step reveal" style="--i:1"><h3><i>1</i>ข้อมูลเพลง</h3>
      <div class="field"><label for="t-cat">หมวดเครื่องดนตรี</label><select id="t-cat">${CATS.filter(c => !c.soon).map(c => `<option>${c.th}</option>`).join('')}</select></div>
      <div class="field"><label for="t-name">ชื่อเพลง</label><input id="t-name" placeholder="Twinkle Twinkle Little Star"></div>
      <div class="field"><label for="t-tip">คำแนะนำถึงนักเรียน</label><textarea id="t-tip" rows="3" placeholder="ฝึกช้าๆ ก่อน แล้วค่อยเพิ่มความเร็ว"></textarea></div>
    </section>
    <section class="step reveal" style="--i:2"><h3><i>2</i>เพิ่มเวอร์ชัน</h3>
      <p class="hint" style="margin:0 0 4px">หนึ่งเพลงมีได้หลายเวอร์ชัน แต่ละเวอร์ชันมีคลิปและไฟล์โน้ตของตัวเอง</p>
      <div class="vlist"><label><input type="checkbox" checked> ง่าย</label><label><input type="checkbox" checked> ปานกลาง</label><label><input type="checkbox"> ยาก</label><label><input type="checkbox"> ทำนอง</label><label><input type="checkbox"> เกา</label><label><input type="checkbox"> ตีคอร์ด</label></div>
    </section>
    <section class="step reveal" style="--i:3"><h3><i>3</i>อัปโหลดคลิป</h3>
      <div class="drop">${UI.upload}<b>แตะเพื่อเลือกคลิปจากมือถือ</b>ไฟล์ .mp4 หรือ .mov ระบบแปลงไฟล์ให้ดูลื่นทุกเน็ตอัตโนมัติ</div>
    </section>
    <section class="step reveal" style="--i:4"><h3><i>4</i>ไฟล์โน้ต</h3>
      <div class="drop">${UI.upload}<b>เลือกไฟล์จาก Guitar Pro หรือ MuseScore</b>.gp · .gpx · .musicxml — ไฟล์เดียวได้ทั้ง Tab คอร์ด และโน้ต</div>
    </section>
    <section class="step reveal" style="--i:5"><h3><i>5</i>ซิงก์โน้ตกับคลิป</h3>
      <p class="hint" style="margin:0 0 8px">ลากหมุดสีเหลืองให้ตรงจังหวะในคลิป ห้องอื่นจะเรียงตามจังหวะเพลงให้อัตโนมัติ</p>
      <div class="wave"><svg viewBox="0 0 600 96" preserveAspectRatio="none" aria-hidden="true">${bars}${marks}</svg></div>
    </section>
    <button class="primary reveal" style="--i:6" id="pub">บันทึกและเผยแพร่</button>
  </div>`;
  $('#pub').onclick = () => toast('ต้นแบบ: ปุ่มนี้จะบันทึกเพลงขึ้นเว็บในเวอร์ชันจริง');
}

/* ============ เส้นทาง ============ */
function route() {
  if (player) { try { player.api.destroy(); } catch (e) { } player = null; window.removeEventListener('resize', syncIndicators); }
  const h = location.hash.replace(/^#/, '') || '/';
  const [, a, b, c] = h.split('/');
  const go = () => {
    window.scrollTo(0, 0);
    if (a === 'cat') renderCat(b);
    else if (a === 'song') renderSong(b, c);
    else if (a === 'teacher') renderTeacher();
    else renderHome();
  };
  if (document.startViewTransition && !REDUCED && route.ready) document.startViewTransition(go); else go();
  route.ready = true;
}
window.addEventListener('hashchange', route);
route();
</script>
